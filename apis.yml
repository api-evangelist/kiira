name: Kiira
description: >-
  Kiira (Kiira Health) was a student-focused digital health / telehealth platform
  that partnered with colleges and universities to bridge the gap between students
  and clinicians, providing online visits with doctors, nurses, and therapists,
  primary care and gynecological consultations, mental health support, and health
  literacy workshops and education resources through a patient booking portal. It
  was surfaced as a portfolio company of 500 Global. As of this pass the company
  operated a consumer/patient web app only and published no public developer API,
  documentation, SDKs, or developer portal, so there is no API surface to enrich.
  Its recorded domain kiira.io is no longer controlled by the company — it now
  redirects to an unrelated third-party site — so this profile reflects the
  company's last-known (archived, Dec 2024) state and is treated as a defunct /
  lapsed lead.
